<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>핏퍼즐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface2:#E4EAE6; --ink:#15221E; --muted:#5B6A64; --line:#D3DCD7;
  --accent:#17624F; --accent-ink:#FFFFFF; --accent-soft:#D6EAE2;
  --m1:#E0384F; --m2:#EE9B1F; --mp:#12B89C; --ms:#86D9C9; --ms-ink:#2E7F71; --mus:#D5DDD8; --sil:#E9EEEB; --fig:#23332D; --fig-far:#9AABA4;
  --floor:#B9C6C0; --mat:#DCE6E1; --body3d:#D3DAD6; --joint3d:#A3B1AB; --mat3d:#B7CBC2; --ok:#1F8A5B; --warn:#B7791F;
  --radius:14px; --shadow:0 1px 2px rgba(20,40,32,.06),0 6px 24px rgba(20,40,32,.06);
  --f-display:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1512; --surface:#16201C; --surface2:#1E2A25; --ink:#E5EEEA; --muted:#98A8A1; --line:#2A3832;
    --accent:#4DBA98; --accent-ink:#0B1411; --accent-soft:#1D3A31;
    --m1:#FF5A6E; --m2:#FFB23F; --mp:#2FE0C0; --ms:#7FCFC0; --ms-ink:#9FE3D6; --mus:#2C3A34; --sil:#1D2824; --fig:#DCE7E2; --fig-far:#5E7068;
    --floor:#3A4A43; --mat:#1E2B26; --body3d:#A9B8B1; --joint3d:#72847C; --mat3d:#2C4A40; --ok:#4DC48A; --warn:#E3A94A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1512; --surface:#16201C; --surface2:#1E2A25; --ink:#E5EEEA; --muted:#98A8A1; --line:#2A3832;
  --accent:#4DBA98; --accent-ink:#0B1411; --accent-soft:#1D3A31;
  --m1:#FF5A6E; --m2:#FFB23F; --mp:#2FE0C0; --ms:#7FCFC0; --ms-ink:#9FE3D6; --mus:#2C3A34; --sil:#1D2824; --fig:#DCE7E2; --fig-far:#5E7068;
  --floor:#3A4A43; --mat:#1E2B26; --body3d:#A9B8B1; --joint3d:#72847C; --mat3d:#2C4A40; --ok:#4DC48A; --warn:#E3A94A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--ink)}
.logo .mark{width:34px;height:34px;flex:none}
.logo .wm{display:grid;line-height:1.1}
.logo .wm b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.logo .wm small{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.14em}
.logo svg{width:26px;height:26px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:640px){.top .wrap{flex-wrap:wrap;gap:4px;padding-block:8px}.tabs{flex-basis:100%}}

main{padding-block:24px 64px}
section[role="tabpanel"]{display:grid;gap:20px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.banner b{font-weight:700}
.banner .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h-sec{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.p{background:color-mix(in srgb,var(--mp) 18%,transparent);color:var(--ms-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mp) 45%,transparent)}
.chip.s{background:color-mix(in srgb,var(--ms) 16%,transparent);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}

/* today */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hello h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.6vw,36px);letter-spacing:-.025em;margin-top:6px}
.hello .sub{color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.stat{padding:12px 14px;border-radius:12px;background:var(--surface2)}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:420px){.stats{gap:8px}.stat{padding:10px}.stat .v{font-size:18px}.stat .v small{font-size:11px}}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500}
.lvbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.lvbar i{height:8px;border-radius:4px;background:var(--line)}
.lvbar i.on{background:var(--accent)}
.quote{display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.quote blockquote{margin:0;font-size:19px;line-height:1.5;font-weight:600;text-wrap:balance}
.quote .src{font-size:13px;color:var(--muted)}

.routine-head{display:flex;flex-wrap:wrap;align-items:end;gap:12px;justify-content:space-between}
.rlist{display:grid;gap:10px;margin-top:16px}
.ritem{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ritem .thumb{width:72px;height:56px;border-radius:9px;background:var(--surface2);overflow:hidden}
.ritem .thumb svg{width:100%;height:100%}
.ritem h4{font-size:15.5px}
.ritem .meta{font-size:13px;color:var(--muted)}
.ritem .dose{font-family:var(--f-mono);font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
.ritem .dose small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}
.ritem button.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}
@media (max-width:520px){.ritem{grid-template-columns:56px 1fr}.ritem .thumb{width:56px;height:46px}.ritem .dose{grid-column:2;text-align:left}}
.note{font-size:13px;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--surface2)}
.note.warn{background:color-mix(in srgb,var(--m2) 14%,transparent);color:var(--ink)}

/* estimate */
.est{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:560px){.est{grid-template-columns:1fr}}
.estbox{display:grid;gap:2px;padding:14px 16px;border-radius:12px;background:var(--surface2)}
.estbox .k{font-size:12.5px;font-weight:700;color:var(--muted)}
.estbox .v{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.estbox .v small{font-size:14px;color:var(--muted);margin-left:3px}
.estbox .d{font-size:12.5px;color:var(--muted)}
.estbar{grid-column:1/-1;display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden}
.estbar i{background:var(--accent);opacity:.85}.estbar i:nth-child(even){opacity:.55}.estbar i.w{background:var(--line);opacity:1}
details.note summary::-webkit-details-marker{color:var(--muted)}
.editrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}
.stepper{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:17px;font-weight:700;line-height:1;color:var(--ink)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper b{min-width:42px;text-align:center;color:var(--ink);font-size:14px}
.seg.pref button[data-pv="1"][aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.pref button[data-pv="-1"][aria-pressed="true"]{background:var(--m1);color:#fff}
.prefrow{margin-top:10px}
.onboarding .tabs{display:none}
.ob-head{display:grid;gap:10px;justify-items:start}
.ob-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.4vw,32px);letter-spacing:-.025em}
.ob-steps{display:flex;gap:6px;width:100%;max-width:420px}
.ob-steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.ob-steps i.on{background:var(--accent)}
.ob-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ob-skip{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.err{color:var(--m1);font-size:13px;font-weight:600}
.remain{display:grid;justify-items:end;line-height:1.15}
.remain .k{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.remain .v{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.lastset{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--m1) 14%,transparent);color:var(--m1);font-weight:700;font-size:13px;animation:hot 1.2s ease-in-out 3}
.nextprev{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--surface2)}
.nextprev .thumb{width:64px;height:50px;border-radius:8px;overflow:hidden;background:var(--surface)}
.nextprev b{display:block;font-size:14.5px}.nextprev span{font-size:12.5px;color:var(--muted)}
.pre{font-family:var(--f-mono);font-size:72px;font-weight:600;color:var(--accent);line-height:1}
.fbpref{display:grid;gap:8px;margin-top:10px}
.fbpref div{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.wt{color:var(--accent);font-weight:700}
.keycard{border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);background:linear-gradient(180deg,var(--accent-soft),transparent 140%);border-radius:14px;padding:14px 16px}
.kc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kc-h b{font-size:15.5px;color:var(--accent)}
.kc-h .muted{font-size:12px;margin-left:auto}
.kc-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.kc-list li{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}
.kc-list li svg{flex:none}
.pulse{display:inline-block;vertical-align:middle;flex:none}
strong.kp{font-weight:700;color:var(--ink);background:linear-gradient(transparent 58%,color-mix(in srgb,var(--accent) 28%,transparent) 58%);padding:0 1px}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.acc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:12px 14px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);grid-row:1;grid-column:3;transition:transform .2s}
.acc[open] summary::after{transform:rotate(-135deg)}
.acc summary .t{font-weight:700;font-size:15px}
.acc summary .t .num{font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-right:4px}
.acc summary .sub{grid-column:2/4;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc[open] summary .sub{white-space:normal}
.acc-b{display:grid;gap:8px;padding:0 14px 14px}
.cue .q{color:var(--accent);font-size:18px;line-height:0;margin:0 2px}
.mist .fix{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 6px;margin-right:4px}
.note.safety{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--m2) 12%,transparent);color:var(--ink)}
.gsec h3 .chip{font-weight:600}
.settable{display:grid;gap:8px;margin-top:10px}
.srow{display:grid;grid-template-columns:70px 1fr 1fr 24px;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:var(--surface2);color:var(--muted)}
.srow .n{font-family:var(--f-mono);font-size:20px;font-weight:600}.srow .n small,.srow .v small{font-size:12px;font-family:var(--f-body);margin-left:2px}
.srow .v{font-family:var(--f-mono);font-size:22px;font-weight:600;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.srow .ck{color:var(--accent);font-weight:700;font-size:18px}
.srow.done{background:color-mix(in srgb,var(--accent) 16%,var(--surface2));color:var(--ink)}
.srow.cur{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--mp)}
.minib{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);font-size:15px;font-weight:700;line-height:1;color:var(--ink);padding:0}
@media (max-width:520px){.srow{grid-template-columns:52px 1fr 1fr 18px;padding:10px}.srow .v{font-size:18px}}
.toolf{margin-bottom:2px}.toolf .opt{padding:5px 10px;font-size:12.5px}
.areah{font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px;margin-top:6px}
.gtag{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 5px;margin-right:5px}
.steps li>span{min-width:0}
/* session */
.session{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
@media (max-width:860px){.session{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stage .fig{aspect-ratio:300/230;max-width:100%;background:var(--surface)}
.stage .fig svg{width:100%;height:100%;display:block}
.stagebar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.phase{font-weight:700;font-size:14px;min-width:84px}
.phase .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--m1);margin-right:6px;vertical-align:1px}
.stagebar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.counter{font-family:var(--f-mono);font-size:56px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.counter small{font-size:18px;color:var(--muted)}
.counter.hot{color:var(--m1);animation:hot 1s ease-in-out infinite}
@keyframes hot{0%{transform:scale(1)}15%{transform:scale(1.12)}40%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.counter.hot{animation:none}}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .4s}
.setdots{display:flex;gap:6px}
.setdots i{width:26px;height:6px;border-radius:3px;background:var(--line)}
.setdots i.on{background:var(--accent)}
.setdots i.cur{background:var(--m1)}

/* feedback */
.fb-opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
@media (max-width:620px){.fb-opts{grid-template-columns:1fr}}
.fb-opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px;display:grid;gap:4px;justify-items:center;text-align:center}
.fb-opt .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.fb-opt b{font-size:14.5px}
.fb-opt span{font-size:12px;color:var(--muted);line-height:1.35}
.fb-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:620px){.fb-opt{grid-template-columns:auto 1fr;justify-items:start;text-align:left;column-gap:10px}.fb-opt span{grid-column:2}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.result-list{display:grid;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.result-list li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.result-list li .mono{font-weight:600}
.up{color:var(--ok)} .down{color:var(--m1)}

/* diag */
.form{display:grid;gap:18px}
.field{display:grid;gap:8px}
.field > label, .field > .lbl{font-weight:700;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.row3{grid-template-columns:1fr 1fr}}
.inp{display:grid;gap:4px}
.inp span{font-size:12.5px;color:var(--muted);font-weight:600}
.inp input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-family:var(--f-mono);font-size:15px}
.diag-layout{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
@media (max-width:900px){.diag-layout{grid-template-columns:1fr}}
.sticky{position:sticky;top:calc(var(--hdr,64px) + 16px)}
/* 영상 고정(sticky) 기능은 사용자 피드백으로 제거 */
}
@media (max-width:900px){.sticky{position:static}}
.bmi-scale{position:relative;margin-top:26px}
.bmi-scale .bands{display:grid;grid-template-columns:18.5fr 4.5fr 2fr 5fr 5fr 5fr;height:10px;border-radius:5px;overflow:hidden}
.bmi-scale .bands i:nth-child(1){background:#8FB6D9}.bmi-scale .bands i:nth-child(2){background:#5CB88E}.bmi-scale .bands i:nth-child(3){background:#E8C14A}.bmi-scale .bands i:nth-child(4){background:#EE9B3B}.bmi-scale .bands i:nth-child(5){background:#E36A4A}.bmi-scale .bands i:nth-child(6){background:#C9384A}
.bmi-scale .mk{position:absolute;top:-22px;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--ink);color:var(--bg);padding:1px 6px;border-radius:5px;white-space:nowrap}
.bmi-scale .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono);margin-top:4px;position:relative;height:14px}
.bmi-scale .ticks span{position:absolute;transform:translateX(-50%)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin-top:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.score-rows{display:grid;gap:8px;margin-top:12px}
.score-row{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.score-row .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.score-row .bar i{display:block;height:100%;background:var(--accent)}

/* guide */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.guide{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.guide{grid-template-columns:1fr}}
.exlist{display:grid;gap:6px}
.exrow{display:contents}
.areah .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:600}
@media (max-width:900px){
  .exlist{display:block}
  .exlist>.toolf,.exlist>.note{margin-bottom:8px}
  .exlist>.areah{margin:12px 0 6px}
  .exrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;margin-inline:-2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .exrow .exbtn{flex:0 0 136px;width:136px;min-width:0;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;gap:6px;padding:6px;align-content:start;scroll-snap-align:start}
  .exrow .exbtn .thumb{width:100%;height:84px}
  .exrow .exbtn>div{min-width:0}
  .exrow .exbtn b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .exrow .exbtn span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;line-height:1.4}
  .guide{gap:14px}
}
.guide>*,.exlist{min-width:0}
.exbtn{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:6px 10px 6px 6px}
.exbtn .thumb{width:52px;height:40px;border-radius:7px;background:var(--surface2);overflow:hidden}
.exbtn .thumb svg{width:100%;height:100%}
.exbtn b{font-size:14px;display:block;line-height:1.3}
.exbtn span{font-size:12px;color:var(--muted)}
.exbtn[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.detail{grid-template-columns:1fr}}
.dhead h2{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.025em}
.dhead .en{color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mmap{display:grid;gap:8px;padding:14px;border-top:1px solid var(--line)}
.mmap svg{width:100%;max-width:340px;height:auto;margin:0 auto;display:block}
.legend{display:flex;gap:14px;justify-content:center;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gsec{display:grid;gap:10px}
.gsec h3{font-size:16px;display:flex;align-items:center;gap:8px}
.gsec h3 .num{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14.5px}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-weight:600;font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cue{padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:14px}
.cue b{display:block}
.mist{display:grid;gap:8px}
.mist div{display:grid;gap:2px;padding:10px 12px;border-left:3px solid var(--m1);background:color-mix(in srgb,var(--m1) 7%,transparent);border-radius:0 10px 10px 0;font-size:14px}
.mist div b{color:var(--m1)}
.vars{display:grid;gap:6px}
.var{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:14px}
.var .l{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted)}
.var.me{border-color:var(--accent);background:var(--accent-soft)}
.var.me .l{color:var(--accent)}
.evid{font-size:14px;padding:14px;border-radius:12px;border:1px dashed var(--line)}
.evid a{color:var(--accent)}
.tempo{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px}
.tempo b{font-weight:700}

/* puzzle */
.pz-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
@media (max-width:900px){.pz-layout{grid-template-columns:1fr}}
.pz{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.pz svg{width:100%;height:auto;display:block}
.pz .piece-empty{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
.pz .piece-edge{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.2}
.pz .piece-new{animation:pop 900ms ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.05)}100%{transform:scale(1)}}
.pz .num{font-family:var(--f-mono);font-size:13px;fill:var(--muted);font-weight:600}
.miles{display:grid;gap:8px;margin-top:10px}
.mile{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:14px}
.mile .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px}
.mile.done .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal i{aspect-ratio:1;border-radius:5px;background:var(--surface2);max-width:100%}
.cal i.on{background:var(--accent)}
.cal i.today{box-shadow:inset 0 0 0 2px var(--ink)}

/* notif */
.notif{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:12px;border-radius:16px;background:var(--surface2);align-items:start}
.notif .ic{width:40px;height:40px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.notif .ic svg{width:40px;height:40px}
.notif b{font-size:14px}
.notif p{font-size:13.5px}
.notif .t{font-size:11.5px;color:var(--muted)}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:.2s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.setrow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.setrow:last-child{border-bottom:0}
.setrow input[type="time"]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-family:var(--f-mono)}

/* share */
.sharecard{grid-template-columns:minmax(0,1fr);width:100%;border-radius:18px;padding:22px;background:linear-gradient(160deg,#17624F,#0F3E33);color:#EAF5F0;display:grid;gap:14px;max-width:420px}
.sharecard .brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.sharecard h3{font-size:22px}
.sharecard .big{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1}
.sharecard .big small{font-size:16px;opacity:.75}
.sharecard .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.sharecard .bar i{display:block;height:100%;background:#7BE0BC}
.sharecard .row{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;opacity:.9}
.sharecard .mini svg{width:100%;height:auto;display:block;border-radius:10px}
.sharecard .mini .piece-edge{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.2}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbox code{flex:1;min-width:0;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:13px;padding:9px 11px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);user-select:all}
.people{display:grid;gap:8px}
.person{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;font-size:14px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--accent)}

/* refs */
.refs{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.refs li{display:grid;grid-template-columns:34px 1fr;gap:10px;font-size:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.refs .id{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent);padding-top:2px}
.refs a{color:var(--accent);overflow-wrap:anywhere}
.refs .use{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.crit div{padding:14px;border-radius:12px;background:var(--surface2);font-size:14px}
.crit b{display:block;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


.figwrap{position:relative}
.stage .fig.fig3d{aspect-ratio:4/3;background:radial-gradient(ellipse at 50% 60%,#2C3236,#16191B 75%);cursor:grab;touch-action:pan-y}
.stage{background:var(--surface)}
.ritem .thumb,.exbtn .thumb,.nextprev .thumb{background:radial-gradient(ellipse at 50% 55%,#2C3236,#16191B 80%)}
.stage .fig.fig3d.drag{cursor:grabbing}
.cv3d{width:100%;height:100%;display:block}
.hud{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);--br:#8A9A93;--ring:.7;pointer-events:none;max-width:calc(100% - 24px)}
.hud .ring{width:36px;height:36px;border-radius:50%;border:2px solid color-mix(in srgb,var(--br) 45%,transparent);display:grid;place-items:center;flex:none}
.hud .ring i{width:30px;height:30px;border-radius:50%;background:var(--br);transform:scale(var(--ring));transition:background .3s}
.hud .brtxt{display:grid;line-height:1.25}
.hud b{font-size:15px;color:var(--br)}
.hud small{font-size:12px;color:var(--muted)}
.hud[data-br="hold"] .ring i{animation:brace .5s ease-in-out infinite alternate}
@keyframes brace{to{transform:scale(.88)}}
.hud-r{position:absolute;right:12px;top:12px;display:grid;gap:4px;font-size:12px;font-weight:600;color:#C9D3CF;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.35);pointer-events:none}
.hud-r i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.hud-hint{position:absolute;right:12px;bottom:10px;font-size:11.5px;color:#9AA6A2;pointer-events:none}
.brline{position:relative;padding:10px 12px 4px;border-top:1px solid var(--line)}
.brsegs{display:flex;gap:3px;height:22px}
.brsegs i{border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0;opacity:.9}
.brsegs span{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;font-style:normal}
.brsegs{position:relative}.brhead{position:absolute;top:-4px;width:3px;height:30px;border-radius:2px;background:var(--ink);transform:translateX(-1px);pointer-events:none;box-shadow:0 0 0 2px var(--surface)}
.brline::after{content:"";}
.brlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:6px 12px 0}
.brlegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
@media (max-width:520px){.hud{padding:6px 10px 6px 6px}.hud .ring{width:30px;height:30px}.hud .ring i{width:24px;height:24px}.hud small{display:none}.hud-r{display:none}}
/* figure */
.glow{opacity:.35;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{opacity:.12}}
@media (prefers-reduced-motion: reduce){.glow{animation:none}.pz .piece-new{animation:none}*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="logo" aria-label="핏퍼즐">
      <span class="mark" id="logoMark"></span>
      <span class="wm"><b>핏퍼즐</b><small>FITPUZZLE</small></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="메뉴">
      <button class="tab" role="tab" data-tab="today" aria-selected="true">오늘</button>
      <button class="tab" role="tab" data-tab="diag" aria-selected="false">체력 진단</button>
      <button class="tab" role="tab" data-tab="guide" aria-selected="false">운동 가이드</button>
      <button class="tab" role="tab" data-tab="puzzle" aria-selected="false">퍼즐 · 알림</button>
      <button class="tab" role="tab" data-tab="share" aria-selected="false">함께하기</button>
      <button class="tab" role="tab" data-tab="refs" aria-selected="false">근거</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="p-today" role="tabpanel"></section>
  <section id="p-diag" role="tabpanel" hidden></section>
  <section id="p-guide" role="tabpanel" hidden></section>
  <section id="p-puzzle" role="tabpanel" hidden></section>
  <section id="p-share" role="tabpanel" hidden></section>
  <section id="p-refs" role="tabpanel" hidden></section>
</main>
<footer class="wrap" style="padding-block:0 40px;font-size:12.5px;color:var(--muted)">기록은 지금 쓰는 기기의 브라우저에 저장돼요. 브라우저 데이터를 지우거나 다른 기기에서 열면 새로 시작해요. 핏퍼즐은 일반적인 운동 정보를 제공하며 의학적 진단을 대신하지 않아요.</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var GSEX=null;
/* ================= LOGO ================= */
function logoSVG(size,opts={}){
  const id='lg'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true">
  <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${opts.light?'#8FE3C4':'#2FA37F'}"/><stop offset="1" stop-color="${opts.light?'#5CC9A3':'#136B55'}"/></linearGradient></defs>
  <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#${id})"/>
  <path d="M11 13.5h6a3.2 3.2 0 1 1 6.4 0H29v6.2a3.2 3.2 0 1 1 0 6.4V29H11z" fill="#fff"/>
  <path d="M13.6 22.4h3.4l1.8-3.6 2.9 6.6 1.8-3h2.9" fill="none" stroke="${opts.light?'#136B55':'#1E8A6B'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;}
(function(){const m=document.getElementById('logoMark');if(m)m.innerHTML=logoSVG(34);
  try{const l=document.createElement('link');l.rel='icon';l.href='data:image/svg+xml,'+encodeURIComponent(logoSVG(64).replace(/url\(#lg\w+\)/,'#1E8A6B').replace(/<defs>.*?<\/defs>/s,''));document.head.appendChild(l);}catch(e){}})();
/* ================= DATA ================= */
const REFS = {
  acsm09:{t:'Donnelly JE 외 (2009). ACSM Position Stand: Appropriate physical activity intervention strategies for weight loss and prevention of weight regain for adults. Med Sci Sports Exerc 41(2):459–471.',u:'https://pubmed.ncbi.nlm.nih.gov/19127177/',use:'감량 목표의 주당 운동량(150→250분 이상), 근력운동 병행 권고'},
  who20:{t:'WHO (2020). WHO guidelines on physical activity and sedentary behaviour.',u:'https://www.who.int/publications/i/item/9789240015128',use:'성인 주 150–300분 중강도 유산소 + 주 2회 이상 근력운동 기준'},
  ratamess:{t:'Ratamess NA 외 (2009). ACSM Position Stand: Progression models in resistance training for healthy adults. Med Sci Sports Exerc 41(3):687–708.',u:'https://pubmed.ncbi.nlm.nih.gov/19204579/',use:'초보자 세트·반복·휴식 기준, 점진적 과부하 원칙, 복합 관절 운동 우선'},
  schoen17:{t:'Schoenfeld BJ, Ogborn D, Krieger JW (2017). Dose-response relationship between weekly resistance training volume and increases in muscle mass. J Sports Sci 35(11):1073–1082.',u:'https://pubmed.ncbi.nlm.nih.gov/27433992/',use:'근육량 목표: 근육당 주 10세트 이상에서 더 큰 근비대'},
  wewege17:{t:'Wewege M 외 (2017). The effects of HIIT vs. moderate-intensity continuous training on body composition in overweight and obese adults. Obes Rev 18(6):635–646.',u:'https://onlinelibrary.wiley.com/doi/abs/10.1111/obr.12532',use:'인터벌 유산소는 지속 유산소와 체지방 감소 효과가 비슷하고 시간이 약 40% 적게 듦'},
  contreras15:{t:'Contreras B 외 (2015). A comparison of gluteus maximus, biceps femoris, and vastus lateralis EMG activity in the back squat and barbell hip thrust. J Appl Biomech 31(6):452–458.',u:'https://pubmed.ncbi.nlm.nih.gov/26214739/',use:'힙 쓰러스트(브릿지 계열)가 스쿼트보다 대둔근 근활성도가 높음'},
  distefano09:{t:'Distefano LJ 외 (2009). Gluteal muscle activation during common therapeutic exercises. J Orthop Sports Phys Ther 39(7):532–540.',u:'https://www.jospt.org/doi/10.2519/jospt.2009.2796',use:'한 다리 스쿼트·한 다리 데드리프트 등 단일 하지 운동의 높은 둔근 활성'},

function countdown(sec,onTick,onDone){
  const end=Date.now()+sec*1000;let last=sec;
  SES.timer=setInterval(()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    if(left!==last){last=left;onTick(left);cue(left);}
    if(left<=0){stopTimer();onDone();}},150);
}
function paintCount(left,label,mmss){const c=$('#cd');if(!c)return;c.innerHTML=mmss?fmt(left):`${left}<small>초</small>`;c.classList.toggle('hot',left<=5&&left>0);
  const n=$('#cdNote');if(n&&label)n.textContent=left<=5&&left>0?label:n.dataset.base;}
function startSession(){
  unlockAudio();keepAwake(true);
  const P=plan();SES={P,i:0,set:1,resting:false,timer:null};
  renderSession();window.scrollTo({top:0,behavior:'smooth'});
}
function stopTimer(){if(SES&&SES.timer){clearInterval(SES.timer);SES.timer=null;}}
function stopAll(){stopTimer();if(SES&&SES.clock){clearInterval(SES.clock);SES.clock=null;}try{speechSynthesis.cancel();}catch(e){}}
function renderSession(){
  stopTimer();if(SES.clock){clearInterval(SES.clock);SES.clock=null;}
  const {P,i,set}=SES,it=P.items[i],ex=it.ex;
  const totalSets=P.items.reduce((a,x)=>a+x.sets,0),doneSets=P.items.slice(0,i).reduce((a,x)=>a+x.sets,0)+set-1;
  const isLastSet=!SES.resting&&set===it.sets,isLastAll=isLastSet&&i===P.items.length-1;
  const el=$('#p-today');
  el.innerHTML=`
  <div class="routine-head"><div><div class="eyebrow">운동 ${i+1} / ${P.items.length} · 예상 ${P.est.kcal}kcal</div><h2 class="h-sec">${ex.name}${isLastSet?' <span class="lastset">'+(isLastAll?'오늘의 마지막 세트':'마지막 세트')+'</span>':''}</h2></div>
    <div class="remain"><span class="k">남은 시간</span><span class="v" id="remV">--:--</span></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="seg" role="group" aria-label="알림"><button data-cue="sound" aria-pressed="${cueSet().sound}">소리</button>${CAN_VIB?`<button data-cue="vib" aria-pressed="${cueSet().vib}">진동</button>`:''}<button data-cue="voice" aria-pressed="${cueSet().voice}">음성 안내</button></div><button class="btn ghost sm" id="cueTest">알림 테스트</button><span class="sp" style="flex:1"></span><button class="btn ghost sm" id="quitSes">그만하기</button></div>
  <div class="progress"><i style="width:${doneSets/totalSets*100}%"></i></div>
  <div class="session">
    <div class="stage">
      <div class="figwrap">${stageHTML('ses')}</div>
      ${stripHTML('ses',ex)}
      <div class="stagebar"><span class="phase"><span class="dot"></span><span id="sesPh"></span></span><span class="muted" style="font-size:13px">${esc(ex.tempo)}</span></div>
    </div>
    <div class="card" style="display:grid;gap:16px">
      <div><div class="eyebrow">${esc(it.variant)}${it.wt?' · '+esc(it.wt):''}</div>
      <div class="setdots" style="margin-top:10px">${Array.from({length:it.sets},(_,k)=>`<i class="${k<set-1?'on':k===set-1?'cur':''}"></i>`).join('')}</div>
      <button type="button" class="ob-skip" id="addSet" style="margin-top:6px">+ 이 운동 한 세트 더 (오늘만)</button></div>
      <div id="sesBody"></div>
      <div class="cue"><b>트레이너 한마디</b>${esc(ex.cues[(set-1)%ex.cues.length][0])} — ${esc(ex.cues[(set-1)%ex.cues.length][1])}</div>
      <p class="muted" style="font-size:13px">호흡: ${esc(ex.breath)}</p>
    </div>
  </div>`;
  const pl=makePlayer($('#sesFig'),ex,stageRefs('ses'));
  $('#quitSes').onclick=()=>{stopAll();SES=null;keepAwake(false);renderToday();};
  $('#addSet').onclick=()=>{it.sets=Math.min(10,it.sets+1);toast(`${ex.name} 오늘 ${it.sets}세트로 늘렸어요`);renderSession();};
  const cs=cueSet();
  $$('[data-cue]').forEach(b=>b.onclick=()=>{const k=b.dataset.cue;cs[k]=!cs[k];save();b.setAttribute('aria-pressed',cs[k]);if(k==='sound'&&cs[k]){unlockAudio();beep(880,.12,.24);}if(k==='vib'&&cs[k])vib(80);if(k==='voice'&&cs[k])say('음성 안내를 켰어요');});
  if($('#cueTest'))$('#cueTest').onclick=()=>{unlockAudio();cue(5);setTimeout(()=>cue(0),900);};
  const body=$('#sesBody');
  if(SES.resting){
    let left=SES.restSec;
    const nIt=set<it.sets?it:P.items[i+1],nSet=set<it.sets?set+1:1,nLast=nSet===nIt.sets;
    body.innerHTML=`<div class="eyebrow">휴식</div><div class="counter mono" id="cd">${left}<small>초</small></div><p class="muted" id="cdNote" data-base="다음: ${esc(SES.nextLabel)}" style="font-size:14px;margin-top:6px">다음: ${esc(SES.nextLabel)}</p>
    <div class="nextprev" style="margin-top:10px"><div class="thumb" id="npThumb"></div><div><b>${nIt.ex.name} · ${nSet}/${nIt.sets}${nIt.unit==='round'?'라운드':'세트'}</b><span>${esc(nIt.dose)}${nLast?' · <b style="display:inline;color:var(--m1)">마지막 세트</b>':''}</span></div></div><p class="muted" style="font-size:12.5px;margin-top:4px">끝나기 5초 전부터 ${cueSet().sound?'소리':''}${cueSet().sound&&CAN_VIB&&cueSet().vib?'와 ':''}${CAN_VIB&&cueSet().vib?'진동':''}${!cueSet().sound&&!(CAN_VIB&&cueSet().vib)?'화면 표시':''}으로 알려줘요</p><div style="margin-top:12px"><button class="btn" id="skip">휴식 건너뛰기</button></div>`;
    pl.paused=true;thumbSVG($('#npThumb'),nIt.ex);
    SES.remFloor=remainingSec(0);startClock(remainingSec(left));
    countdown(left,l=>{paintCount(l,`${l}초 후 시작 · ${SES.nextLabel} 준비 자세 잡기`);if(l===5)say(`5초 뒤 ${nIt.ex.name}${nLast?', 마지막 세트':''}`);},advanceAfterRest);
    $('#skip').onclick=advanceAfterRest;
    return;
  }
  SES.remFloor=0;startClock(remainingSec(0));
  if(isLastSet){cueLast();say(isLastAll?'오늘의 마지막 세트예요. 힘내세요':`${ex.name} 마지막 세트`);}
  else if(set===1)say(`${ex.name} 시작`);
  if(it.unit==='reps'){
    if(!SES.log)SES.log={};if(!SES.log[i])SES.log[i]=[];
    if(SES.cur===undefined||SES.curI!==i){SES.curI=i;SES.cur={kg:it.kg?it.kg.kg:null,reps:parseInt(it.dose,10)};}
    const c=SES.cur,st=it.kg?it.kg.st:1,unitKg=it.kg&&it.kg.per?'kg·한 손':'kg';
    const row=(k)=>{const done=k<set,cur=k===set,d=done?SES.log[i][k-1]:c;
      return `<div class="srow ${done?'done':cur?'cur':''}"><span class="n">${k}<small>세트</small></span>
        ${it.kg?`<span class="v">${cur?`<button type="button" class="minib" data-adj="kg" data-d="-1" aria-label="무게 줄이기">−</button>`:''}${d.kg}<small>${unitKg}</small>${cur?`<button type="button" class="minib" data-adj="kg" data-d="1" aria-label="무게 늘리기">+</button>`:''}</span>`:''}
        <span class="v">${cur?`<button type="button" class="minib" data-adj="reps" data-d="-1" aria-label="횟수 줄이기">−</button>`:''}${d.reps}<small>회${ex.perSide?' 한쪽':''}</small>${cur?`<button type="button" class="minib" data-adj="reps" data-d="1" aria-label="횟수 늘리기">+</button>`:''}</span>
        <span class="ck">${done?'✓':''}</span></div>`;};
    body.innerHTML=`<div class="eyebrow">세트 ${set} / ${it.sets}${it.kg&&!it.kg.logged&&MACH[ex.id]?' · 추천 시작 무게':''}${it.kg&&it.kg.logged?' · 지난 기록 무게':''}</div>
      <div class="settable">${Array.from({length:it.sets},(_,k)=>row(k+1)).join('')}</div>
      <div style="margin-top:14px"><button class="btn primary lg" id="setDone">${set} 세트 완료</button></div>`;
    $$('[data-adj]',body).forEach(b=>b.onclick=()=>{const k=b.dataset.adj,d=+b.dataset.d;if(k==='kg')c.kg=Math.max(st,Math.round((c.kg+d*st)*10)/10);else c.reps=Math.max(1,c.reps+d);renderSession();});
    $('#setDone').onclick=()=>{SES.log[i].push({kg:c.kg,reps:c.reps});if(it.kg&&c.kg){S.wlog[ex.id]=c.kg;save();}finishSet();};
  }else{
    const sec=it.sec||parseInt(it.dose,10);
    body.innerHTML=`<div class="eyebrow">${it.unit==='steady'?esc(it.variant):(it.unit==='round'?'라운드':'세트')+' '+set+' / '+it.sets}</div><div class="counter mono" id="cd">${it.unit==='steady'?fmt(sec):sec+'<small>초</small>'}</div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary lg" id="go">타이머 시작</button><button class="btn" id="setDone">완료</button></div>`;
    $('#go').onclick=()=>{unlockAudio();$('#go').disabled=true;const c=$('#cd');let pre=3;
      c.innerHTML=`<span class="pre">3</span>`;beep(700,.1,.22);say('셋');
      SES.timer=setInterval(()=>{pre--;if(pre>0){c.innerHTML=`<span class="pre">${pre}</span>`;beep(700,.1,.22);say(pre===2?'둘':'하나');}
        else{stopTimer();beep(1175,.2,.28);vib(120);say('시작');c.innerHTML=it.unit==='steady'?fmt(sec):`${sec}<small>초</small>`;countdown(sec,l=>paintCount(l,null,it.unit==='steady'),finishSet);}},1000);};
    $('#setDone').onclick=finishSet;
  }
}
function finishSet(){
  stopTimer();if(SES.clock){clearInterval(SES.clock);SES.clock=null;}
  const it=SES.P.items[SES.i];
  const last=SES.i===SES.P.items.length-1&&SES.set===it.sets;
  if(last){stopAll();SES=null;keepAwake(false);say('오늘 운동 끝! 수고했어요');showFeedback(true);return;}
  let restSec=SES.P.restSec;
  if(it.unit==='round')restSec=Math.max(15,45-SES.P.L*5);
  const nextIt=SES.set<it.sets?it:SES.P.items[SES.i+1];
  SES.nextLabel=SES.set<it.sets?`${it.ex.name} ${SES.set+1}세트`:nextIt.ex.name;
  SES.resting=true;SES.restSec=restSec;renderSession();
}
function advanceAfterRest(){
  stopTimer();const it=SES.P.items[SES.i];SES.resting=false;
  if(SES.set<it.sets)SES.set++;else{SES.i++;SES.set=1;}
  renderSession();
}

const FB=[
 {v:1,b:'너무 쉬웠어요',s:'5회 이상 더 할 수 있었어요',adj:2,lv:.34},
 {v:2,b:'쉬웠어요',s:'3~4회 더 할 수 있었어요',adj:1,lv:0},
 {v:3,b:'딱 적당해요',s:'1~2회 더 할 수 있었어요',adj:0,lv:0},
 {v:4,b:'힘들었어요',s:'마지막 세트는 한계였어요',adj:-1,lv:0},
 {v:5,b:'너무 힘들었어요',s:'자세를 유지하기 어려웠어요',adj:-2,lv:-.34}
];
function showFeedback(fromSession){
  const P=plan();let pick=3;
  const el=$('#p-today');
  el.innerHTML=`${fromSession?`<div class="banner"><b>수고했어요!</b><span>오늘 루틴을 모두 마쳤어요.</span></div>`:''}
  <div class="card">
    <div class="eyebrow">운동 후 난이도 체크</div>
    <h2 class="h-sec" style="margin-top:4px">오늘 운동, 어땠어요?</h2>
    <p class="muted" style="font-size:14px">마지막 세트가 끝났을 때 몇 번 더 할 수 있었는지로 골라주세요. 이 답으로 다음 루틴의 횟수와 레벨을 조정해요.</p>
    <div class="fb-opts">${FB.map(f=>`<button class="fb-opt" data-v="${f.v}" aria-pressed="${f.v===3}"><span class="n">${f.v}</span><b>${f.b}</b><span>${f.s}</span></button>`).join('')}</div>
    <div style="margin-top:18px"><div class="eyebrow">운동별로 다음에 얼마나 넣을까요?</div>
      <div class="fbpref">${P.items.map(it=>`<div><span>${it.ex.name}</span>${prefSeg(it.ex.id)}</div>`).join('')}</div></div>
    <div style="display:grid;gap:10px;margin-top:16px">
      <label class="check"><input type="checkbox" id="painK"> 운동 중 무릎이 아팠어요</label>
      <label class="check"><input type="checkbox" id="painB"> 운동 중 허리가 아팠어요</label>
    </div>
    <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap"><button class="btn primary lg" id="fbSubmit">기록하고 퍼즐 조각 받기</button><button class="btn ghost" id="fbCancel">취소</button></div>
  </div>`;
  $$('.fb-opt',el).forEach(b=>b.onclick=()=>{pick=+b.dataset.v;$$('.fb-opt',el).forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('#fbCancel').onclick=renderToday;
  $('#fbSubmit').onclick=()=>{
    const f=FB[pick-1],before=plan(),Lb=before.L;
    const pk=$('#painK').checked,pb=$('#painB').checked;
    const wchg=[];
    before.items.forEach(it=>{
      if(it.kg&&S.wlog&&S.wlog[it.ex.id]){const o=S.wlog[it.ex.id],st=it.kg.st;let n=o;if(pick<=2)n=o+st;else if(pick>=4)n=Math.max(st,o-st);
        if(n!==o){S.wlog[it.ex.id]=Math.round(n*10)/10;wchg.push(`${it.ex.name} ${o} → ${S.wlog[it.ex.id]}kg`);}}
      else S.off[it.ex.id]=Math.max(-6,Math.min(8,(S.off[it.ex.id]||0)+f.adj));});
    S.lvAdj=Math.max(-2,Math.min(2,S.lvAdj+f.lv));
    // 3회 연속 "쉬웠어요" 이상이면 레벨업
    const recent=[...S.sessions.slice(-2).map(s=>s.r),pick];
    if(recent.length===3&&recent.every(r=>r<=2)){S.lvAdj=Math.min(2,S.lvAdj+.5);}
    if(recent.length===3&&recent.every(r=>r>=4)){S.lvAdj=Math.max(-2,S.lvAdj-.5);}
    if(pk)S.prof.knee=true;if(pb)S.prof.back=true;
    S.sessions.push({d:todayStr(),r:pick});save();
    const after=plan();
    const diffs=after.items.map(a=>{const b=before.items.find(x=>x.ex.id===a.ex.id);return {n:a.ex.name,b:b?b.dose:'새로 추가',a:a.dose,ch:!b||b.dose!==a.dose,v:b&&b.variant!==a.variant?a.variant:null};});
    el.innerHTML=`<div class="card">
      <div class="eyebrow">다음 루틴 재조정 완료</div>
      <h2 class="h-sec" style="margin-top:4px">퍼즐 ${S.sessions.length}번째 조각을 받았어요</h2>
      <p style="margin-top:6px;font-weight:600">오늘 약 <span class="mono">${before.est.totalMin}분</span> 운동 · 약 <span class="mono">${before.est.kcal}kcal</span> 소모 (추정)</p>
      <p class="muted" style="font-size:14px">선택: ${f.b} · 레벨 ${Lb===after.L?`Lv.${after.L} 유지`:`Lv.${Lb} → <b class="${after.L>Lb?'up':'down'}">Lv.${after.L}</b>`}</p>
      ${wchg.length?`<div class="note" style="margin-top:10px">${PULSE('var(--accent)',16)} 다음 추천 무게: <b>${wchg.map(esc).join(' · ')}</b></div>`:''}
      <ul class="result-list">${diffs.map(d=>`<li><span style="min-width:120px">${d.n}</span><span class="mono ${d.ch?(f.adj>0?'up':'down'):''}">${d.ch?`${d.b} → ${d.a}`:d.a}</span>${d.v?`<span class="chip acc">${esc(d.v)}</span>`:''}</li>`).join('')}</ul>
      ${pk||pb?`<div class="note warn" style="margin-top:12px">통증이 있었던 부위를 반영해 대체 운동으로 바꿨어요. 같은 통증이 반복되면 운동을 멈추고 의사나 물리치료사와 상담해 주세요.</div>`:''}
      <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap"><button class="btn primary" data-go="puzzle">퍼즐 보러 가기</button><button class="btn" id="backToday">오늘 화면으로</button></div>
    </div>`;
    $('#backToday').onclick=renderToday;
    PZ_NEW=S.sessions.length-1;
  };
}

let PZ_NEW=-1;
function grid(n){let best=[n,1],sc=1e9;for(let r=1;r<=n;r++){if(n%r)continue;const c=n/r;if(c<r)break;const s=Math.abs(c/r-1.5);if(s<sc){sc=s;best=[c,r];}}return best;}
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};}
const EDGE=[[0,0],[.35,0],'C',[.40,0],[.42,.05],[.38,.12],'C',[.33,.22],[.42,.30],[.50,.30],'C',[.58,.30],[.67,.22],[.62,.12],'C',[.58,.05],[.60,0],[.65,0],[1,0]];
function edgePath(p0,p1,out,bump,sz){
  if(!bump)return `L${p1[0].toFixed(1)},${p1[1].toFixed(1)}`;
  const P=([u,v])=>[p0[0]+(p1[0]-p0[0])*u+out[0]*v*bump*sz,p0[1]+(p1[1]-p0[1])*u+out[1]*v*bump*sz];
  let d='',i=1;
  const fmt=q=>{const r=P(q);return r[0].toFixed(1)+','+r[1].toFixed(1);};
  d+=`L${fmt(EDGE[1])}`;i=2;
  while(i<EDGE.length){if(EDGE[i]==='C'){d+=`C${fmt(EDGE[i+1])} ${fmt(EDGE[i+2])} ${fmt(EDGE[i+3])}`;i+=4;}else{d+=`L${fmt(EDGE[i])}`;i++;}}
  return d;
}
function puzzleSVG(done,tot,opts={}){
  const [c,r]=grid(tot),W=600,w=W/c,h=w,H=h*r,sz=Math.min(w,h);
  const rand=rng(tot*97+13);
  const sh=[],sv=[];
  for(let y=0;y<=r;y++){sh[y]=[];for(let x=0;x<c;x++)sh[y][x]=(y===0||y===r)?0:(rand()<.5?1:-1);}
  for(let y=0;y<r;y++){sv[y]=[];for(let x=0;x<=c;x++)sv[y][x]=(x===0||x===c)?0:(rand()<.5?1:-1);}
  const piece=(x,y)=>{const X=x*w,Y=y*h;
    return `M${X},${Y}`+edgePath([X,Y],[X+w,Y],[0,-1],-sh[y][x],sz)+edgePath([X+w,Y],[X+w,Y+h],[1,0],sv[y][x+1],sz)+edgePath([X+w,Y+h],[X,Y+h],[0,1],sh[y+1][x],sz)+edgePath([X,Y+h],[X,Y],[-1,0],-sv[y][x],sz)+'Z';};
  // fill order: 아래 줄부터 위로 — 정상을 향해 올라가는 순서
  const order=[];for(let y=r-1;y>=0;y--)for(let x=0;x<c;x++)order.push(y*c+x);
  const uid='pz'+(opts.id||'m');
  let defs='',body='';
  order.forEach((idx,k)=>{const x=idx%c,y=Math.floor(idx/c),d=piece(x,y);
    if(k<done){defs+=`<clipPath id="${uid}c${idx}"><path d="${d}"/></clipPath>`;
      body+=`<g class="${k===PZ_NEW&&!opts.mini?'piece-new':''}" style="transform-origin:${x*w+w/2}px ${y*h+h/2}px"><use href="#${uid}art" clip-path="url(#${uid}c${idx})"/><path class="piece-edge" d="${d}"/></g>`;}
    else body+=`<path class="piece-empty" d="${d}" ${opts.mini?'style="fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.22)"':''}/>${opts.mini?'':`<text class="num" x="${x*w+w/2}" y="${y*h+h/2+5}" text-anchor="middle">${k+1}</text>`}`;
  });
  const art=`<symbol id="${uid}art" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="${uid}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB86B"/><stop offset=".55" stop-color="#FF8A7A"/><stop offset="1" stop-color="#8E7BD0"/></linearGradient>
    <linearGradient id="${uid}m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3F8F7A"/><stop offset="1" stop-color="#17624F"/></linearGradient></defs>
    <rect width="600" height="400" fill="url(#${uid}sky)"/>
    <circle cx="430" cy="150" r="52" fill="#FFE3A3"/><circle cx="430" cy="150" r="80" fill="#FFE3A3" opacity=".25"/>
    <path d="M0,260 L90,190 L160,230 L250,150 L340,220 L420,170 L520,230 L600,190 L600,400 L0,400Z" fill="#6D6BB5" opacity=".75"/>
    <path d="M0,300 L120,220 L200,270 L300,90 L390,250 L470,200 L600,280 L600,400 L0,400Z" fill="url(#${uid}m1)"/>
    <path d="M300,90 L272,140 L290,132 L302,150 L318,130 L332,140Z" fill="#EAF5F0"/>
    <path d="M300,90 L300,52" stroke="#15221E" stroke-width="3"/><path d="M300,52 L332,62 L300,72Z" fill="#E0384F"/>
    <path d="M60,400 C120,360 90,330 170,320 C250,310 200,270 250,240 C280,220 270,170 292,120" fill="none" stroke="#FFF3D6" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
    <path d="M0,340 L140,300 L240,350 L360,300 L480,340 L600,310 L600,400 L0,400Z" fill="#0F3E33"/>
  </symbol>`;
  return `<svg viewBox="-6 -6 ${W+12} ${H+12}" role="img" aria-label="퍼즐 ${done}/${tot} 조각 완성"><defs>${art}${defs}</defs>${body}</svg>`;
}

    <div><b>3. 맨몸·소도구로 가능</b>집에서 덤벨이나 물병만으로 할 수 있고, 5단계 변형으로 입문자부터 상급자까지 이어져요.</div>
    <div><b>4. 관절·허리 안전성</b>허리 부담이 적은 코어 운동, 무릎이 불편할 때의 대체 운동, BMI 30 이상의 저충격 버전을 함께 제공해요.</div>
  </div>
  <div class="note warn">이 서비스는 일반적인 운동 정보를 제공하며 의학적 진단이나 치료를 대신하지 않아요. 지병이 있거나 운동 중 통증·어지러움·흉통이 생기면 즉시 멈추고 전문가와 상담하세요.</div>
  <div><div class="eyebrow">참고 문헌 ${used.length}편</div></div>
  <ol class="refs">${used.map((k,i)=>`<li><span class="id">${String(i+1).padStart(2,'0')}</span><div>${esc(REFS[k].t)}<span class="use">적용: ${esc(REFS[k].use)}</span><a href="${REFS[k].u}" target="_blank" rel="noopener">${REFS[k].u.replace('https://','')}</a></div></li>`).join('')}</ol>`;
}

/* ================= ROUTING ================= */
const RENDER={today:renderToday,diag:renderDiag,guide:renderGuide,puzzle:renderPuzzle,share:renderShare,refs:renderRefs};
let CUR='today';
function go(tab,opts={}){
  if(SES&&tab!=='today'){stopAll();SES=null;keepAwake(false);}
  CUR=tab;
  $$('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===tab));
  $$('[role="tabpanel"]').forEach(p=>{p.hidden=p.id!=='p-'+tab;if(p.hidden)p.innerHTML='';});
  RENDER[tab]();
  if(!opts.keepScroll)window.scrollTo({top:0});
  try{history.replaceState(null,'','#'+tab);}catch(e){}
}
function renderAll(){}
$$('.tab').forEach(t=>t.onclick=()=>go(t.dataset.tab));
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
  const gd=e.target.closest('[data-guide]');if(gd){G.id=gd.dataset.guide;G.cat='전체';go('guide');}
});
function setHdr(){const t=document.querySelector('.top');if(t)document.documentElement.style.setProperty('--hdr',t.offsetHeight+'px');}
setHdr();addEventListener('resize',setHdr);
const h=(location.hash||'').slice(1);
if(FIRST){document.body.classList.add('onboarding');go('diag',{keepScroll:true});}
else go(RENDER[h]?h:'today',{keepScroll:true});
setHdr();
</script>
